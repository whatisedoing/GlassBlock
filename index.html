<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Block Map</title>
<meta name="theme-color" content="#0e1d22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#0e1d22; --deep:#16303a; --frost:#e8f4f1; --aqua:#62d6c8; --aqua-d:#2a9d92;
  --amber:#f0b44c; --line:rgba(232,244,241,.16); --muted:#9fb8b6;
  --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--frost);font-family:var(--font);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* login */
#login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:420px;width:100%;margin:0 auto}
#login h1{font-size:34px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
#login p{color:var(--muted);margin:0 0 24px}
input[type=text],input[type=email],input[type=password],textarea{
  width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--deep);
  color:var(--frost);font:inherit;font-size:16px;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
.primary{width:100%;padding:15px;border:0;border-radius:14px;background:var(--aqua);color:#08232a;font-weight:800;font-size:17px}
.primary:disabled{opacity:.45}
.err{color:#ff9d8f;min-height:22px;font-size:14px;margin:8px 0 0}

/* app shell */
#app{flex:1;display:flex;flex-direction:column;min-height:0}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px}
header b{font-weight:800;letter-spacing:-.01em}
header button{background:none;border:0;color:var(--muted);font-size:14px}
#views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0}

/* home */
#view-home{display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:16px;padding:16px 20px;overflow-y:auto}
#tagBtn{
  width:min(62vw,250px);aspect-ratio:1;flex:none;border-radius:14%;border:1px solid rgba(255,255,255,.35);position:relative;
  background:linear-gradient(145deg,rgba(150,240,230,.75),rgba(42,157,146,.45) 55%,rgba(20,90,100,.6));
  box-shadow:inset 0 0 0 10px rgba(255,255,255,.07),inset 0 0 0 11px rgba(255,255,255,.28),
             inset 10px 14px 30px rgba(255,255,255,.35),inset -14px -18px 34px rgba(0,40,50,.45),
             0 24px 60px rgba(42,157,146,.35);
  font-size:30px;font-weight:800;color:#f4fffd;text-shadow:0 2px 12px rgba(0,50,60,.5);
  transition:transform .12s ease,box-shadow .12s ease;overflow:hidden}
#tagBtn::before{content:"";position:absolute;top:-30%;left:-20%;width:70%;height:160%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:rotate(12deg)}
#tagBtn:active{transform:scale(.95)}
#count{color:var(--muted);text-align:center;line-height:1.5}
#count strong{color:var(--frost);font-size:20px}

/* map */
#map{position:absolute;inset:0;background:var(--ink)}
.leaflet-tile-pane{filter:invert(1) grayscale(1) brightness(.85) contrast(1.15) sepia(.6) hue-rotate(128deg) saturate(1.6)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:0 4px 16px rgba(0,0,0,.35)!important}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--ink);color:var(--frost);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--deep)}
.leaflet-control-attribution{background:rgba(14,29,34,.8)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--aqua)!important}
#locate{position:absolute;right:14px;bottom:14px;z-index:900;padding:11px 16px;border-radius:12px;border:0;
  background:var(--ink);color:var(--frost);font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.gb-pin{width:26px;height:26px;border-radius:7px;border:2px solid #fff;
  background:var(--pc,#62d6c8);
  background:linear-gradient(145deg,color-mix(in srgb,var(--pc,#62d6c8) 45%,#fff),var(--pc,#62d6c8));
  box-shadow:0 3px 10px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.25)}
.gb-pin.move{background:linear-gradient(145deg,#ffd98a,#f0b44c)}
#moveBar{position:absolute;top:12px;left:58px;right:12px;z-index:1000;display:flex;align-items:center;gap:8px;background:var(--ink);
  border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#moveBar span{flex:1;font-size:14px;line-height:1.25}
#moveBar button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:none}
#moveDone{background:var(--aqua)!important;color:#08232a;border-color:var(--aqua)!important;font-weight:700}
#view-list{display:flex;flex-direction:column}
#listTabs{padding:4px 16px 12px}
.tablewrap{flex:1;overflow:auto;padding:0 8px 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--ink);text-align:left;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.notes{max-width:170px;overflow:hidden;text-overflow:ellipsis}
tr.r:active{background:var(--deep)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
#score{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.sc{min-width:110px;padding:14px 18px;border-radius:16px;border:1px solid var(--line);border-top:3px solid var(--pc,var(--aqua));
  background:var(--deep);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.sc.lead{box-shadow:inset 0 0 0 1px var(--pc)}
.sc.lead .sc-n{color:var(--pc)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pc,var(--aqua));color:#08232a;
  font-weight:800;overflow:hidden;flex:none;border:2px solid var(--pc,var(--aqua))}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);margin-right:7px}
#profileBtn{background:none;border:0;padding:0;line-height:0}
#swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{aspect-ratio:1;border-radius:14px;border:2px solid transparent;background:var(--pc);color:#08232a;font-size:22px;font-weight:800}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--deep) inset}
.sw.on::after{content:"✓"}
.sc-n{font-size:30px;font-weight:800;line-height:1.1}
.sc-name{color:var(--muted);font-size:14px;margin-top:2px}
.me-dot{width:16px;height:16px;border-radius:50%;background:var(--amber);border:3px solid #fff;box-shadow:0 0 0 6px rgba(240,180,76,.3)}

/* nav */
nav{display:flex;background:var(--deep);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:1500}
nav button{flex:1;padding:16px 0;background:none;border:0;color:var(--muted);font-weight:600;font-size:16px}
nav button.on{color:var(--aqua)}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:2100;background:var(--deep);border-radius:24px 24px 0 0;
  max-height:90dvh;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto}
.sheet.open{transform:translateY(0)}
.sheet h2{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.status{font-size:14px;color:var(--amber);margin-bottom:16px}
.status.ok{color:var(--aqua)}
.field{margin-bottom:16px}
.field>label,.field>span{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:15px}
.chip.on{background:var(--aqua);border-color:var(--aqua);color:#08232a;font-weight:600}
.photo-btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px dashed var(--aqua-d);text-align:center;color:var(--aqua);background:none;font-weight:600}
#photoPreview{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px}
.row{display:flex;gap:10px}
.ghost{flex:0 0 auto;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:none;font-weight:600}
.danger{color:#ff9d8f}
#detailPhoto{width:100%;border-radius:14px;margin:10px 0 14px;display:block}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 0 16px}
dt{color:var(--muted)} dd{margin:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--frost);color:var(--ink);
  padding:12px 18px;border-radius:12px;font-weight:600;z-index:3000;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@keyframes pulse{50%{opacity:.55}}
#tagBtn.busy{animation:pulse 1s ease-in-out infinite;pointer-events:none}
.seg{display:flex;background:var(--deep);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{background:none;border:0;padding:9px 22px;border-radius:999px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--aqua);color:#08232a}
#sessionBar{display:flex;align-items:center;gap:14px;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 16px}
#sessionBar span{font-weight:600}
#sessionBar button{padding:10px 16px;border-radius:10px;border:0;background:var(--aqua);color:#08232a;font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="hidden">
  <h1>Glass Block Map</h1>
  <p>Sign in to start tagging.</p>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- NAME (first sign-in only) -->
<section id="nameBox" class="hidden" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:420px;width:100%;margin:0 auto">
  <h1 style="font-size:30px;font-weight:800;margin:0 0 6px">What should we call you?</h1>
  <p style="color:var(--muted);margin:0 0 20px">This name appears on the tags you add.</p>
  <input id="nameInput" type="text" placeholder="Your name" maxlength="30">
  <button class="primary" id="nameSave">Continue</button>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header><b>Glass Block Map</b><button id="profileBtn" aria-label="Your profile"></button></header>
  <div id="views">
    <section class="view" id="view-home">
      <div class="seg" id="modeToggle"><button type="button" data-m="simple">Simple</button><button type="button" data-m="detailed">Detailed</button></div>
      <button id="tagBtn">Tag a block</button>
      <div id="sessionBar" class="hidden"><span id="sessionText"></span><button type="button" id="doneBtn">Done tagging</button></div>
      <div id="count"></div>
      <div id="score"></div>
    </section>
    <section class="view hidden" id="view-map">
      <div id="map"></div>
      <div id="moveBar" class="hidden"><span>Drag the pin or tap the map</span><button id="moveCancel">Cancel</button><button id="moveDone">Done</button></div>
      <button id="locate">Locate me</button>
    </section>
    <section class="view hidden" id="view-list">
      <div class="chips" id="listTabs"></div>
      <div class="tablewrap"><table id="tbl"></table></div>
    </section>
  </div>
  <nav>
    <button id="navHome" class="on">Tag</button>
    <button id="navMap">Map</button>
    <button id="navList">List</button>
  </nav>
</div>

<!-- TAG SHEET -->
<div class="backdrop" id="tagBackdrop"></div>
<div class="sheet" id="tagSheet">
  <h2 id="tagTitle">New glass block</h2>
  <div class="status" id="gpsStatus">Finding your location…</div>
  <div class="field hidden" id="locEdit">
    <span>Pin location</span>
    <div id="locText" style="margin-bottom:10px"></div>
    <div class="row">
      <button type="button" class="ghost" id="movePin" style="flex:1">Move pin on map</button>
      <button type="button" class="ghost" id="useMyLoc" style="flex:1">Use my location</button>
    </div>
  </div>
  <div class="field"><span>Type</span><div class="chips" data-field="block_type"></div></div>
  <div class="field"><span>Colour</span><div class="chips" data-field="colour"></div></div>
  <div class="field"><span>Building</span><div class="chips" data-field="building_type"></div></div>
  <div class="field">
    <button type="button" class="photo-btn" id="photoBtn">Add a photo</button>
    <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden">
    <img id="photoPreview" class="hidden" alt="Photo preview">
  </div>
  <div class="field"><textarea id="notes" placeholder="Notes (optional)"></textarea></div>
  <div class="row">
    <button class="ghost" id="tagCancel">Cancel</button>
    <button class="primary" id="tagSave" disabled>Save tag</button>
  </div>
</div>

<!-- DETAIL SHEET -->
<div class="backdrop" id="detailBackdrop"></div>
<div class="sheet" id="detailSheet">
  <h2 id="detailTitle">Glass block</h2>
  <img id="detailPhoto" class="hidden" alt="Glass block photo">
  <dl id="detailList"></dl>
  <div class="row">
    <button class="ghost danger" id="detailDelete">Delete</button>
    <button class="ghost" id="detailEdit">Edit</button>
    <button class="primary" id="detailClose">Close</button>
  </div>
</div>

<!-- DONE TAGGING SHEET -->
<div class="backdrop" id="doneBackdrop"></div>
<div class="sheet" id="doneSheet">
  <h2>Done tagging?</h2>
  <p id="doneText" style="color:var(--muted);margin:6px 0 18px;line-height:1.45"></p>
  <button class="primary" id="doneAdd" style="margin-bottom:10px">Add details now</button>
  <button class="ghost" id="doneSkip" style="width:100%">Skip, keep them as they are</button>
</div>

<!-- PROFILE SHEET -->
<div class="backdrop" id="profBackdrop"></div>
<div class="sheet" id="profSheet">
  <h2>Your profile</h2>
  <div style="display:flex;align-items:center;gap:16px;margin:14px 0 20px">
    <div id="profAv" style="line-height:0"></div>
    <div>
      <button type="button" class="photo-btn" id="avBtn" style="width:auto;padding:10px 16px">Change photo</button>
      <input type="file" id="avInput" accept="image/*" class="hidden">
    </div>
  </div>
  <div class="field"><label for="profName">Name</label><input id="profName" type="text" maxlength="30"></div>
  <div class="field"><span>Colour: <b id="swName" style="color:var(--frost)"></b></span><div id="swatches"></div></div>
  <div class="row">
    <button class="ghost" id="profCancel">Cancel</button>
    <button class="primary" id="profSave">Save profile</button>
  </div>
  <button class="ghost danger" id="signOut" style="width:100%;margin-top:12px">Sign out</button>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SUPABASE_URL = "https://prdylxlscsmsndxrwzpk.supabase.co";
const SUPABASE_KEY = "sb_publishable_nXCSUQXO1kClzVR4l4l1kQ_pAokhVV4";
const START_VIEW = { lat: 49.8951, lng: -97.1384, zoom: 12 }; // Winnipeg, used when nothing is tagged yet

const OPTIONS = {
  block_type: ["Clear", "Wave", "Cross-ribbed", "Frosted", "Vented", "Other"],
  colour: ["Clear", "Blue", "Green", "Amber", "White / frosted", "Other"],
  building_type: ["Residential", "Commercial", "Public / other"]
};

const PALETTE = [
  { n: "Aqua", c: "#62d6c8" }, { n: "Sky", c: "#6db5ff" }, { n: "Violet", c: "#a393f7" }, { n: "Orchid", c: "#ee8fd0" },
  { n: "Coral", c: "#ff8a80" }, { n: "Amber", c: "#f0b44c" }, { n: "Lime", c: "#b9e35f" }, { n: "Sand", c: "#e4d3a8" }
];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let user = null, myName = "", map = null, markerLayer = null, meMarker = null;
let profiles = {}, avatarUrls = {}, tagNames = {};
let mode = "detailed", sessionIds = [], review = null, quickBusy = false;

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } }
};
const sessionKey = () => "gb_session_" + (user ? user.id : "");
function loadSession(){
  try { const a = JSON.parse(store.get(sessionKey()) || "[]"); sessionIds = Array.isArray(a) ? a : []; }
  catch { sessionIds = []; }
}
function saveSession(){ store.set(sessionKey(), JSON.stringify(sessionIds)); }
function renderSession(){
  const n = sessionIds.length;
  $("sessionBar").classList.toggle("hidden", n === 0);
  $("sessionText").textContent = `${n} ${n === 1 ? "tag" : "tags"} this session`;
}
function removeFromSession(id){ sessionIds = sessionIds.filter(x => x !== id); saveSession(); renderSession(); }

function paintMode(){
  document.querySelectorAll("#modeToggle button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
}
$("modeToggle").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.m; store.set("gb_mode", mode); paintMode();
  toast(mode === "simple" ? "Simple mode: one tap saves your spot" : "Detailed mode: add info as you tag");
});
mode = store.get("gb_mode") === "simple" ? "simple" : "detailed";
paintMode();
let rows = [], current = null, here = null, photoBlob = null, picked = {};
let editing = null, editLoc = null, moveMarker = null;

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- sign-in ---------- */
function show(id){ ["login","nameBox","app"].forEach(x => $(x).classList.toggle("hidden", x !== id)); }

async function route(){
  const { data } = await sb.auth.getSession();
  user = data.session ? data.session.user : null;
  if (!user) { profiles = {}; sessionIds = []; return show("login"); }
  await loadProfiles();
  if (!profiles[user.id]) {
    const nm = user.user_metadata && user.user_metadata.name;
    if (!nm) return show("nameBox");
    await createProfile(nm);
  }
  myName = (profiles[user.id] && profiles[user.id].name) || (user.user_metadata && user.user_metadata.name) || "Me";
  loadSession(); renderSession();
  show("app");
  updateAvatarBtn();
  refreshAll(false);
}

async function createProfile(name){
  const used = Object.values(profiles).map(p => p.colour);
  const free = PALETTE.find(o => !used.includes(o.c)) || PALETTE[0];
  const { data, error } = await sb.from("profiles").insert({ user_id: user.id, name, colour: free.c }).select().single();
  if (error) { console.error(error); return false; }
  profiles[user.id] = data; return true;
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginBtn").disabled = true; $("loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  $("loginBtn").disabled = false;
  if (error) { $("loginErr").textContent = "Couldn't sign in. Check your email and password."; return; }
  route();
});

$("nameSave").addEventListener("click", async () => {
  const n = $("nameInput").value.trim();
  if (!n) return;
  if (!(await createProfile(n))) { toast("Couldn't save your name. Try again."); return; }
  route();
});

/* ---------- navigation & data ---------- */
function showView(name){
  ["home", "map", "list"].forEach(v => {
    $("view-" + v).classList.toggle("hidden", name !== v);
    $("nav" + v[0].toUpperCase() + v.slice(1)).classList.toggle("on", name === v);
  });
  if (name === "map") { ensureMap(); refreshAll(true); }
  else refreshAll(false);
}
$("navHome").onclick = () => showView("home");
$("navMap").onclick = () => showView("map");
$("navList").onclick = () => showView("list");

async function loadRows(){
  const { data, error } = await sb.from("glass_blocks").select("*").order("created_at", { ascending: false });
  if (error) { toast("Couldn't load the tags."); return false; }
  rows = data; tagNames = {};
  rows.forEach(r => { if (!tagNames[r.user_id]) tagNames[r.user_id] = r.tagged_by; });
  return true;
}
async function refreshAll(fit){
  const [ok] = await Promise.all([loadRows(), loadProfiles()]);
  if (!ok) return;
  updateAvatarBtn();
  renderScore(); renderList();
  if (map) renderMarkers(fit);
}
function refreshCount(){ return refreshAll(false); }

/* ---------- profiles ---------- */
const colourOf = id => { const c = profiles[id] && profiles[id].colour; return /^#[0-9a-f]{6}$/i.test(c || "") ? c : PALETTE[0].c; };
const nameOf = (id, fb) => (profiles[id] && profiles[id].name) || fb || tagNames[id] || "Someone";
const avatarUrlOf = id => { const p = profiles[id], c = p && p.avatar_path && avatarUrls[p.avatar_path]; return c ? c.url : null; };

function avatarHTML(id, size, o = {}){
  const c = o.colour || colourOf(id), nm = o.name || nameOf(id);
  const url = o.url !== undefined ? o.url : avatarUrlOf(id);
  const inner = url ? `<img src="${esc(url)}" alt="">` : esc((nm || "?").trim().charAt(0).toUpperCase());
  return `<span class="av" style="--pc:${c};width:${size}px;height:${size}px;font-size:${Math.round(size * 0.45)}px">${inner}</span>`;
}
function updateAvatarBtn(){ if (user) $("profileBtn").innerHTML = avatarHTML(user.id, 34); }

async function loadProfiles(){
  const { data, error } = await sb.from("profiles").select("*");
  if (error) { console.error(error); return; }
  profiles = {}; data.forEach(p => { profiles[p.user_id] = p; });
  const now = Date.now();
  const need = Object.values(profiles).map(p => p.avatar_path)
    .filter(path => path && (!avatarUrls[path] || now - avatarUrls[path].t > 30 * 60000));
  if (!need.length) return;
  const res = await sb.storage.from("photos").createSignedUrls(need, 3600);
  (res.data || []).forEach(d => { if (d.signedUrl) avatarUrls[d.path] = { url: d.signedUrl, t: now }; });
}

/* ---------- scoreboard ---------- */
function renderScore(){
  const counts = {};
  rows.forEach(r => { counts[r.user_id] = (counts[r.user_id] || 0) + 1; });
  Object.keys(profiles).forEach(id => { if (!(id in counts)) counts[id] = 0; });
  if (user && !(user.id in counts)) counts[user.id] = 0;
  const arr = Object.entries(counts).sort((a, b) => b[1] - a[1] || nameOf(a[0]).localeCompare(nameOf(b[0])));
  const top = arr.length > 1 && arr[0][1] > arr[1][1] ? arr[0][0] : null;
  $("count").innerHTML = `<strong>${rows.length}</strong><br>${rows.length === 1 ? "block" : "blocks"} found so far`;
  $("score").innerHTML = arr.slice(0, 4).map(([id, c]) =>
    `<div class="sc${id === top ? " lead" : ""}" style="--pc:${colourOf(id)}">${avatarHTML(id, 34)}<div class="sc-n">${c}</div><div class="sc-name">${esc(nameOf(id))}</div></div>`).join("");
}

/* ---------- list ---------- */
let listFilter = "All";
const fmtWhen = iso => {
  const d = new Date(iso), o = { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
  return d.toLocaleString([], o);
};
function renderList(){
  const mine = user ? user.id : null;
  const ids = [...new Set(rows.map(r => r.user_id))]
    .sort((a, b) => a === mine ? -1 : b === mine ? 1 : nameOf(a).localeCompare(nameOf(b)));
  if (listFilter !== "All" && !ids.includes(listFilter)) listFilter = "All";
  $("listTabs").innerHTML = ["All", ...ids].map(t => {
    const n = t === "All" ? rows.length : rows.filter(r => r.user_id === t).length;
    const label = t === "All" ? "All" : `<span class="dot" style="--pc:${colourOf(t)}"></span>${esc(nameOf(t))}`;
    return `<button type="button" class="chip${t === listFilter ? " on" : ""}" data-t="${esc(t)}">${label} (${n})</button>`;
  }).join("");
  const list = listFilter === "All" ? rows : rows.filter(r => r.user_id === listFilter);
  const by = listFilter === "All";
  if (!list.length) { $("tbl").innerHTML = '<tr><td class="empty">No tags here yet.</td></tr>'; return; }
  $("tbl").innerHTML = `<thead><tr><th>When</th>${by ? "<th>By</th>" : ""}<th>Type</th><th>Colour</th><th>Building</th><th>Photo</th><th>Notes</th></tr></thead><tbody>` +
    list.map(r => `<tr class="r" data-id="${esc(r.id)}"><td>${esc(fmtWhen(r.created_at))}</td>` +
      (by ? `<td><span class="dot" style="--pc:${colourOf(r.user_id)}"></span>${esc(nameOf(r.user_id, r.tagged_by))}</td>` : "") +
      `<td>${esc(r.block_type || "–")}</td><td>${esc(r.colour || "–")}</td><td>${esc(r.building_type || "–")}</td>` +
      `<td>${r.photo_path ? "Yes" : "–"}</td><td class="notes">${esc(r.notes || "")}</td></tr>`).join("") + "</tbody>";
}
$("listTabs").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  listFilter = b.dataset.t; renderList();
});
$("tbl").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-id]"); if (!tr) return;
  const r = rows.find(x => x.id === tr.dataset.id); if (r) openDetail(r);
});

/* ---------- tagging ---------- */
function buildChips(){
  document.querySelectorAll("#tagSheet .chips").forEach(box => {
    const f = box.dataset.field;
    box.innerHTML = OPTIONS[f].map(o => `<button type="button" class="chip" data-v="${esc(o)}">${esc(o)}</button>`).join("");
    box.onclick = e => {
      const b = e.target.closest(".chip"); if (!b) return;
      const was = b.classList.contains("on");
      box.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      if (!was) { b.classList.add("on"); picked[f] = b.dataset.v; } else { delete picked[f]; }
    };
  });
}

function openSheet(name){ $(name + "Backdrop").classList.add("open"); $(name + "Sheet").classList.add("open"); }
function closeSheet(name){ $(name + "Backdrop").classList.remove("open"); $(name + "Sheet").classList.remove("open"); }

$("tagBtn").addEventListener("click", () => {
  if (mode === "simple") { quickTag(); return; }
  editing = null; editLoc = null; review = null;
  $("tagCancel").textContent = "Cancel";
  $("tagTitle").textContent = "New glass block"; $("tagSave").textContent = "Save tag";
  $("locEdit").classList.add("hidden"); $("gpsStatus").classList.remove("hidden");
  here = null; photoBlob = null; picked = {};
  buildChips();
  $("notes").value = ""; $("photoInput").value = "";
  $("photoPreview").classList.add("hidden"); $("photoBtn").textContent = "Add a photo";
  $("tagSave").disabled = true;
  setStatus("Finding your location…", false);
  openSheet("tag");
  if (!navigator.geolocation) return setStatus("This browser can't share location.", false);
  navigator.geolocation.getCurrentPosition(pos => {
    here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    setStatus(`Location locked (within ${Math.round(pos.coords.accuracy)} m)`, true);
    $("tagSave").disabled = false;
  }, err => {
    setStatus(err.code === 1 ? "Location is blocked. Allow location for this site in your browser settings, then try again."
                              : "Couldn't get your location. Step outside or try again.", false);
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
});

function setStatus(t, ok){ const s = $("gpsStatus"); s.textContent = t; s.classList.toggle("ok", !!ok); }

/* ---------- simple mode ---------- */
async function quickTag(){
  if (quickBusy) return;
  if (!navigator.geolocation) { toast("This browser can't share location."); return; }
  quickBusy = true;
  const btn = $("tagBtn"); btn.classList.add("busy"); btn.textContent = "Locating…";
  try {
    const pos = await new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }));
    const { data, error } = await sb.from("glass_blocks")
      .insert({ tagged_by: myName, lat: pos.coords.latitude, lng: pos.coords.longitude }).select().single();
    if (error) throw error;
    sessionIds.push(data.id); saveSession(); renderSession();
    if (navigator.vibrate) navigator.vibrate(40);
    toast(`Tagged! ${sessionIds.length} this session`);
    refreshAll(false);
  } catch (err) {
    toast(err && err.code === 1 ? "Location is blocked. Allow it in your browser settings."
        : err && err.code ? "Couldn't get your location. Try again." : "Couldn't save the tag. Check your connection.");
  }
  btn.classList.remove("busy"); btn.textContent = "Tag a block"; quickBusy = false;
}

$("doneBtn").addEventListener("click", () => {
  const n = sessionIds.length;
  $("doneText").textContent = `${n} ${n === 1 ? "tag is" : "tags are"} saved. Want to add type, colour, photos and notes? You can also edit any tag later from the Map or List.`;
  openSheet("done");
});
$("doneBackdrop").onclick = () => closeSheet("done");
$("doneSkip").addEventListener("click", () => {
  const n = sessionIds.length;
  sessionIds = []; saveSession(); renderSession(); closeSheet("done");
  toast(`Done! ${n} ${n === 1 ? "tag" : "tags"} saved`);
});
$("doneAdd").addEventListener("click", async () => {
  closeSheet("done");
  const { data, error } = await sb.from("glass_blocks").select("*").in("id", sessionIds).order("created_at", { ascending: true });
  if (error) { toast("Couldn't load your tags."); return; }
  if (!data.length) { sessionIds = []; saveSession(); renderSession(); return; }
  review = { queue: data, i: 0 };
  openEdit(data[0]);
});

function saveLabel(){
  if (review) return review.i === review.queue.length - 1 ? "Save & finish" : "Save & next";
  return editing ? "Save changes" : "Save tag";
}
function advanceReview(){
  removeFromSession(review.queue[review.i].id);
  review.i++;
  if (review.i >= review.queue.length) {
    review = null; editing = null; closeSheet("tag"); toast("All done!"); refreshAll(false); return;
  }
  openEdit(review.queue[review.i]);
}
function endReview(){
  review = null; editing = null; closeSheet("tag");
  toast("Saved for later. Tap Done tagging to continue."); refreshAll(false);
}

/* ---------- editing ---------- */
function updateLocText(){
  const moved = editing && (editLoc.lat !== editing.lat || editLoc.lng !== editing.lng);
  $("locText").textContent = `${editLoc.lat.toFixed(5)}, ${editLoc.lng.toFixed(5)}` + (moved ? "  (moved)" : "");
}

function openEdit(r){
  editing = r; editLoc = { lat: r.lat, lng: r.lng };
  photoBlob = null; picked = {};
  ["block_type", "colour", "building_type"].forEach(f => { if (r[f]) picked[f] = r[f]; });
  buildChips();
  document.querySelectorAll("#tagSheet .chip").forEach(c => {
    if (picked[c.parentElement.dataset.field] === c.dataset.v) c.classList.add("on");
  });
  $("notes").value = r.notes || ""; $("photoInput").value = "";
  $("tagTitle").textContent = review ? `Add details · ${review.i + 1} of ${review.queue.length}` : "Edit glass block";
  $("tagCancel").textContent = review ? "Skip" : "Cancel";
  if (review) { $("gpsStatus").classList.remove("hidden"); setStatus(`Tagged ${fmtWhen(r.created_at)}`, true); }
  else $("gpsStatus").classList.add("hidden");
  $("locEdit").classList.remove("hidden"); updateLocText();
  $("tagSave").textContent = saveLabel(); $("tagSave").disabled = false;
  const pv = $("photoPreview"); pv.classList.add("hidden"); pv.removeAttribute("src");
  $("photoBtn").textContent = r.photo_path ? "Change photo" : "Add a photo";
  openSheet("tag");
  if (r.photo_path) {
    sb.storage.from("photos").createSignedUrl(r.photo_path, 3600).then(({ data }) => {
      if (data && editing === r && !photoBlob) { pv.src = data.signedUrl; pv.classList.remove("hidden"); }
    });
  }
}

$("movePin").onclick = () => {
  closeSheet("tag");
  if ($("view-map").classList.contains("hidden")) showView("map");
  moveMarker = L.marker([editLoc.lat, editLoc.lng], {
    draggable: true, zIndexOffset: 1000,
    icon: L.divIcon({ className: "", html: '<div class="gb-pin move"></div>', iconSize: [26, 26], iconAnchor: [13, 13] })
  }).addTo(map);
  map.setView([editLoc.lat, editLoc.lng], Math.max(map.getZoom(), 18));
  map.on("click", onMoveClick);
  $("moveBar").classList.remove("hidden");
};
function onMoveClick(e){ if (moveMarker) moveMarker.setLatLng(e.latlng); }
function endMove(apply){
  if (apply && moveMarker) { const p = moveMarker.getLatLng(); editLoc = { lat: p.lat, lng: p.lng }; updateLocText(); }
  if (moveMarker) { moveMarker.remove(); moveMarker = null; }
  map.off("click", onMoveClick);
  $("moveBar").classList.add("hidden");
  openSheet("tag");
}
$("moveDone").onclick = () => endMove(true);
$("moveCancel").onclick = () => endMove(false);

$("useMyLoc").onclick = () => {
  if (!navigator.geolocation) return toast("This browser can't share location.");
  const b = $("useMyLoc"); b.textContent = "Locating…";
  navigator.geolocation.getCurrentPosition(p => {
    editLoc = { lat: p.coords.latitude, lng: p.coords.longitude }; updateLocText(); b.textContent = "Use my location";
  }, () => { toast("Couldn't get your location."); b.textContent = "Use my location"; },
  { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
};

$("tagCancel").onclick = () => { if (review) advanceReview(); else closeSheet("tag"); };
$("tagBackdrop").onclick = () => { if (review) endReview(); else closeSheet("tag"); };
$("photoBtn").onclick = () => $("photoInput").click();
$("photoInput").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    photoBlob = await shrink(f);
    $("photoPreview").src = URL.createObjectURL(photoBlob);
    $("photoPreview").classList.remove("hidden");
    $("photoBtn").textContent = "Change photo";
  } catch (err) { toast("Couldn't read that photo."); }
});

async function shrink(file){
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(), "image/jpeg", 0.82));
}

$("tagSave").addEventListener("click", async () => {
  if (!editing && !here) return;
  $("tagSave").disabled = true; $("tagSave").textContent = "Saving…";
  try {
    let photo_path = null;
    if (photoBlob) {
      photo_path = `${user.id}/${crypto.randomUUID()}.jpg`;
      const up = await sb.storage.from("photos").upload(photo_path, photoBlob, { contentType: "image/jpeg" });
      if (up.error) throw up.error;
    }
    const fields = {
      block_type: picked.block_type || null, colour: picked.colour || null,
      building_type: picked.building_type || null, notes: $("notes").value.trim() || null
    };
    if (editing) {
      const upd = { ...fields, lat: editLoc.lat, lng: editLoc.lng };
      if (photo_path) upd.photo_path = photo_path;
      const { data, error } = await sb.from("glass_blocks").update(upd).eq("id", editing.id).select();
      if (error) throw error;
      if (!data || !data.length) throw new Error("No rows updated");
      if (photo_path && editing.photo_path) await sb.storage.from("photos").remove([editing.photo_path]);
      if (review) advanceReview();
      else { closeSheet("tag"); toast("Changes saved"); editing = null; refreshAll(false); }
    } else {
      const { error } = await sb.from("glass_blocks").insert({
        tagged_by: myName, lat: here.lat, lng: here.lng, ...fields, photo_path
      });
      if (error) throw error;
      closeSheet("tag"); toast("Tagged!"); refreshCount();
    }
  } catch (err) {
    console.error(err); toast("Couldn't save. Check your connection and try again.");
  }
  $("tagSave").textContent = saveLabel(); $("tagSave").disabled = false;
});

/* ---------- map ---------- */
function ensureMap(){
  if (!map) {
    map = L.map("map", { zoomControl: true }).setView([START_VIEW.lat, START_VIEW.lng], START_VIEW.zoom);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    markerLayer = L.layerGroup().addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 50);
}

function renderMarkers(fit){
  markerLayer.clearLayers();
  const pts = [];
  rows.forEach(r => {
    const m = L.marker([r.lat, r.lng], { icon: L.divIcon({ className: "", html: `<div class="gb-pin" style="--pc:${colourOf(r.user_id)}"></div>`, iconSize: [26, 26], iconAnchor: [13, 13] }) });
    m.on("click", () => { if (!moveMarker) openDetail(r); });
    m.addTo(markerLayer); pts.push([r.lat, r.lng]);
  });
  if (fit && pts.length && !moveMarker) map.fitBounds(pts, { padding: [50, 50], maxZoom: 17 });
}

$("locate").addEventListener("click", () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (meMarker) meMarker.remove();
    meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map);
    map.setView(ll, Math.max(map.getZoom(), 16));
  }, () => toast("Couldn't get your location."), { enableHighAccuracy: true, timeout: 15000 });
});

async function openDetail(r){
  current = r;
  const when = new Date(r.created_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  $("detailTitle").textContent = "Glass block";
  const items = [["Tagged by", nameOf(r.user_id, r.tagged_by)], ["When", when], ["Type", r.block_type], ["Colour", r.colour], ["Building", r.building_type], ["Notes", r.notes]];
  $("detailList").innerHTML = items.filter(i => i[1]).map(i => `<dt>${esc(i[0])}</dt><dd>${esc(i[1])}</dd>`).join("") +
    `<dt>Place</dt><dd><a style="color:var(--aqua)" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.lat},${r.lng}">Open in Maps</a></dd>`;
  const img = $("detailPhoto"); img.classList.add("hidden"); img.removeAttribute("src");
  openSheet("detail");
  if (r.photo_path) {
    const { data } = await sb.storage.from("photos").createSignedUrl(r.photo_path, 3600);
    if (data && current === r) { img.src = data.signedUrl; img.classList.remove("hidden"); }
  }
}
$("detailClose").onclick = () => closeSheet("detail");
$("detailEdit").onclick = () => { if (!current) return; closeSheet("detail"); openEdit(current); };
$("detailBackdrop").onclick = () => closeSheet("detail");
$("detailDelete").addEventListener("click", async () => {
  if (!current || !confirm("Delete this tag? This can't be undone.")) return;
  if (current.photo_path) await sb.storage.from("photos").remove([current.photo_path]);
  const { error } = await sb.from("glass_blocks").delete().eq("id", current.id);
  if (error) { toast("Couldn't delete it."); return; }
  closeSheet("detail"); toast("Deleted"); refreshAll(false);
});

/* ---------- profile editor ---------- */
let draft = null, avatarBlob = null;

async function shrinkSquare(file, size){
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const side = Math.min(bmp.width, bmp.height);
  const c = document.createElement("canvas"); c.width = c.height = size;
  c.getContext("2d").drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, size, size);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(), "image/jpeg", 0.85));
}

function renderProfPreview(){
  const url = avatarBlob ? URL.createObjectURL(avatarBlob) : avatarUrlOf(user.id);
  $("profAv").innerHTML = avatarHTML(user.id, 84, { colour: draft.colour, name: $("profName").value || draft.name, url });
}
function renderSwatches(){
  $("swatches").innerHTML = PALETTE.map(o =>
    `<button type="button" class="sw${o.c === draft.colour ? " on" : ""}" data-c="${o.c}" style="--pc:${o.c}" aria-label="${o.n}" title="${o.n}"></button>`).join("");
  const cur = PALETTE.find(o => o.c === draft.colour);
  $("swName").textContent = cur ? cur.n : "";
}

$("profileBtn").addEventListener("click", () => {
  draft = { name: myName, colour: colourOf(user.id) };
  avatarBlob = null; $("avInput").value = "";
  $("profName").value = draft.name;
  renderSwatches(); renderProfPreview();
  openSheet("prof");
});
$("swatches").addEventListener("click", e => {
  const b = e.target.closest(".sw"); if (!b) return;
  draft.colour = b.dataset.c; renderSwatches(); renderProfPreview();
});
$("profName").addEventListener("input", renderProfPreview);
$("avBtn").onclick = () => $("avInput").click();
$("avInput").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try { avatarBlob = await shrinkSquare(f, 320); renderProfPreview(); }
  catch (err) { toast("Couldn't read that photo."); }
});
$("profCancel").onclick = () => closeSheet("prof");
$("profBackdrop").onclick = () => closeSheet("prof");

$("profSave").addEventListener("click", async () => {
  const name = $("profName").value.trim();
  if (!name) { toast("Please enter a name."); return; }
  $("profSave").disabled = true; $("profSave").textContent = "Saving…";
  try {
    const old = profiles[user.id] ? profiles[user.id].avatar_path : null;
    let avatar_path = old || null;
    if (avatarBlob) {
      avatar_path = `avatars/${user.id}-${Date.now()}.jpg`;
      const up = await sb.storage.from("photos").upload(avatar_path, avatarBlob, { contentType: "image/jpeg" });
      if (up.error) throw up.error;
    }
    const { data, error } = await sb.from("profiles")
      .upsert({ user_id: user.id, name, colour: draft.colour, avatar_path, updated_at: new Date().toISOString() })
      .select().single();
    if (error) throw error;
    if (avatarBlob && old) await sb.storage.from("photos").remove([old]);
    profiles[user.id] = data; myName = data.name;
    await loadProfiles();
    closeSheet("prof"); toast("Profile saved"); refreshAll(false);
  } catch (err) {
    console.error(err); toast("Couldn't save your profile. Try again.");
  }
  $("profSave").textContent = "Save profile"; $("profSave").disabled = false;
});

$("signOut").addEventListener("click", async () => { closeSheet("prof"); await sb.auth.signOut(); route(); });

sb.auth.onAuthStateChange(() => {});
route();
</script>
